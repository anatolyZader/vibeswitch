# CI: lint, test with coverage, and SonarCloud analysis.
# Add SONAR_TOKEN to GitHub Secrets (Settings -> Secrets and variables -> Actions).
# Project key and organization are in sonar-project.properties; extension uses same project key (vibeswitch.sonar.projectKey).

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-test-sonar:
    name: Lint, test, coverage, SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test and coverage (LCOV for SonarCloud)
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
