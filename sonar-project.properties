# SonarCloud project configuration (non-secret).
# Store SONAR_TOKEN in GitHub Secrets only (Settings → Secrets and variables → Actions).

sonar.organization=vibeswitch
sonar.projectKey=vibeswitch
sonar.host.url=https://sonarcloud.io

sonar.sources=business_modules,ui,cross_cut_modules,lib,extension.js,compositionRoot.js,diContainer.js
sonar.exclusions=**/node_modules/**,**/out/**,**/coverage/**,**/tests/**,**/__tests__/**,**/*.test.js,**/__mocks__/**

# LCOV coverage (optional; CI can run npm run test:coverage and pass this path)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
